[workspace]
resolver = "2"
members = [
    "crates/opengobo-protocol",
    "crates/opengobo-fixture",
    "crates/opengobo-storage",
    "crates/opengobo-engine",
    "crates/opengobo-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
license-file = "LICENSE"
repository = "https://github.com/OpenGobo/core"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
opengobo-protocol = { path = "crates/opengobo-protocol" }
opengobo-fixture = { path = "crates/opengobo-fixture" }
opengobo-storage = { path = "crates/opengobo-storage" }
opengobo-engine = { path = "crates/opengobo-engine" }

argon2 = "0.6.0"
clap = { version = "4.6.7", features = ["derive"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
